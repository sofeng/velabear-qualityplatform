x-siyuan-web-environment: &siyuan-web-environment
  CORS_ALLOWED_ORIGINS: http://localhost:43080,http://127.0.0.1:43080,http://host.docker.internal:43080
  CSRF_TRUSTED_ORIGINS: http://localhost:43080,http://127.0.0.1:43080,http://host.docker.internal:43080
  EMAIL_VERIFICATION_EXPOSE_CODE: "1"
  AI_SESSION_WORKSPACE_CODEX_ENABLED: "0"

services:
  testhub-mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: testhub-siyuan-mysql
    ports: !override
      - "34306:3306"
    volumes: !override
      - ../../.docker-data/testhub-platform-siyuan-quality/mysql:/var/lib/mysql:z

  testhub-redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: testhub-siyuan-redis
    ports: !override
      - "37379:6379"
    volumes: !override
      - ../../.docker-data/testhub-platform-siyuan-quality/redis:/data:z

  testhub-backend-init:
    image: local/testhub-platform-backend-siyuan:latest
    container_name: testhub-siyuan-backend-init
    build:
      context: ../..
      dockerfile: deploy/docker/backend.container.Dockerfile
      args:
        BACKEND_RUNTIME_BASE: local/testhub-platform-backend-core-runtime-siyuan:latest
    environment:
      <<: *siyuan-web-environment
    volumes: !override
      - ../../.docker-data/testhub-platform-siyuan-quality/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-siyuan-quality/media:/app/media:z
      - ../../.docker-data/testhub-platform-siyuan-quality/static:/app/static:z
      - ../../.docker-data/testhub-platform-siyuan-quality/logs:/app/logs:z
      - ../init-seed:/app/init-seed:ro,z

  testhub-backend:
    image: local/testhub-platform-backend-siyuan:latest
    container_name: testhub-siyuan-backend
    environment:
      <<: *siyuan-web-environment
    ports: !override
      - "59000:8000"
    volumes: !override
      - ../../.docker-data/testhub-platform-siyuan-quality/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-siyuan-quality/media:/app/media:z
      - ../../.docker-data/testhub-platform-siyuan-quality/static:/app/static:z
      - ../../.docker-data/testhub-platform-siyuan-quality/logs:/app/logs:z

  testhub-automation-service:
    image: local/testhub-platform-automation-service-siyuan:latest
    container_name: testhub-siyuan-automation-service
    build:
      context: ../..
      dockerfile: deploy/docker/backend.automation-service.Dockerfile
      args:
        BACKEND_RUNTIME_BASE: local/testhub-platform-backend-automation-runtime-siyuan:latest
    environment:
      <<: *siyuan-web-environment
      PLAYWRIGHT_RECORDER_CDP_HOST_PORT: "60222"
      PLAYWRIGHT_RECORDER_CDP_HOST_PORT_END: "60262"
      PLAYWRIGHT_RECORDER_DEVTOOLS_EXTERNAL_ORIGIN: http://localhost:60222
      PLAYWRIGHT_RECORDER_NOVNC_HOST_PORT: "57080"
      PLAYWRIGHT_RECORDER_NOVNC_HOST_PORT_END: "57120"
      PLAYWRIGHT_RECORDER_NOVNC_EXTERNAL_ORIGIN: http://localhost:57080
    ports: !override
      - "60222-60262:9222-9262"
      - "127.0.0.1:57080-57120:6080-6120"
    volumes: !override
      - ../../.docker-data/testhub-platform-siyuan-quality/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-siyuan-quality/media:/app/media:z
      - ../../.docker-data/testhub-platform-siyuan-quality/static:/app/static:z
      - ../../.docker-data/testhub-platform-siyuan-quality/logs:/app/logs:z
      - ../../playwright_snapshot:/app/playwright_snapshot:z

  testhub-document-service:
    image: local/testhub-platform-document-service-siyuan:latest
    container_name: testhub-siyuan-document-service
    build:
      context: ../..
      dockerfile: deploy/docker/backend.service.Dockerfile
      args:
        BACKEND_RUNTIME_BASE: local/testhub-platform-backend-document-runtime-siyuan:latest
        TESTHUB_RUNTIME_ROLE: document
    environment:
      <<: *siyuan-web-environment
    volumes: !override
      - ../../.docker-data/testhub-platform-siyuan-quality/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-siyuan-quality/media:/app/media:z
      - ../../.docker-data/testhub-platform-siyuan-quality/static:/app/static:z
      - ../../.docker-data/testhub-platform-siyuan-quality/logs:/app/logs:z

  testhub-asset-service:
    image: local/testhub-platform-asset-service-siyuan:latest
    container_name: testhub-siyuan-asset-service
    build:
      context: ../..
      dockerfile: deploy/docker/backend.service.Dockerfile
      args:
        BACKEND_RUNTIME_BASE: local/testhub-platform-backend-asset-runtime-siyuan:latest
        TESTHUB_RUNTIME_ROLE: asset
    environment:
      <<: *siyuan-web-environment
    volumes: !override
      - ../../.docker-data/testhub-platform-siyuan-quality/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-siyuan-quality/media:/app/media:z
      - ../../.docker-data/testhub-platform-siyuan-quality/static:/app/static:z
      - ../../.docker-data/testhub-platform-siyuan-quality/logs:/app/logs:z
      - ../..:/workspace/source-repo:ro,z

  testhub-report-service:
    image: local/testhub-platform-report-service-siyuan:latest
    container_name: testhub-siyuan-report-service
    build:
      context: ../..
      dockerfile: deploy/docker/backend.service.Dockerfile
      args:
        BACKEND_RUNTIME_BASE: local/testhub-platform-backend-report-runtime-siyuan:latest
        TESTHUB_RUNTIME_ROLE: report
    environment:
      <<: *siyuan-web-environment
    volumes: !override
      - ../../.docker-data/testhub-platform-siyuan-quality/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-siyuan-quality/media:/app/media:z
      - ../../.docker-data/testhub-platform-siyuan-quality/static:/app/static:z
      - ../../.docker-data/testhub-platform-siyuan-quality/logs:/app/logs:z

  testhub-asset-worker:
    image: local/testhub-platform-asset-service-siyuan:latest
    container_name: testhub-siyuan-asset-worker
    environment:
      <<: *siyuan-web-environment
    volumes: !override
      - ../../.docker-data/testhub-platform-siyuan-quality/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-siyuan-quality/media:/app/media:z
      - ../../.docker-data/testhub-platform-siyuan-quality/static:/app/static:z
      - ../../.docker-data/testhub-platform-siyuan-quality/logs:/app/logs:z
      - ../..:/workspace/source-repo:ro,z

  testhub-integration-service:
    image: local/testhub-platform-integration-service-siyuan:latest
    container_name: testhub-siyuan-integration-service
    build:
      context: ../..
      dockerfile: deploy/docker/backend.service.Dockerfile
      args:
        BACKEND_RUNTIME_BASE: local/testhub-platform-backend-integration-runtime-siyuan:latest
        TESTHUB_RUNTIME_ROLE: integration
    environment:
      <<: *siyuan-web-environment
      AI_SESSION_WORKSPACE_CODEX_ENABLED: "0"
    volumes: !override
      - ../../.docker-data/testhub-platform-siyuan-quality/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-siyuan-quality/media:/app/media:z
      - ../../.docker-data/testhub-platform-siyuan-quality/static:/app/static:z
      - ../../.docker-data/testhub-platform-siyuan-quality/logs:/app/logs:z

  testhub-frontend:
    image: local/testhub-platform-frontend-siyuan:latest
    container_name: testhub-siyuan-frontend
    build:
      context: ../..
      dockerfile: deploy/docker/frontend.container.Dockerfile
    ports: !override
      - "43080:80"
    depends_on: !override
      testhub-backend:
        condition: service_started
      testhub-automation-service:
        condition: service_started
      testhub-document-service:
        condition: service_started
      testhub-asset-service:
        condition: service_started
      testhub-integration-service:
        condition: service_started
      testhub-report-service:
        condition: service_started

  testhub-deployment-service:
    profiles: ["siyuan-disabled"]

  testhub-deployment-worker:
    profiles: ["siyuan-disabled"]

  testhub-ai-dev-worker:
    profiles: ["siyuan-disabled"]

  testhub-codex-runtime:
    profiles: ["siyuan-disabled"]

  testhub-claude-runtime:
    profiles: ["siyuan-disabled"]
