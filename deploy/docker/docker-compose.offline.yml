version: "2.4"

services:
  testhub-mysql:
    image: local/testhub-mysql-bundle:8.0
    container_name: ${CONTAINER_PREFIX:-testhub}-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testhub}
      MYSQL_USER: ${MYSQL_USER:-testhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testhub123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/mysql:/var/lib/mysql:z"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  testhub-redis:
    image: local/testhub-redis-bundle:7-alpine
    container_name: ${CONTAINER_PREFIX:-testhub}-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-1234}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/redis:/data:z"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  testhub-backend-init:
    image: local/testhub-platform-backend-bundle:${IMAGE_TAG:-20260424}
    container_name: ${CONTAINER_PREFIX:-testhub}-backend-init
    restart: "no"
    command: ["init"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-backend.settings_container}
      DEBUG: ${DEBUG:-False}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-0}
      APP_PORT: "8000"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-testhub-bundle}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testhub-frontend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:31080,http://127.0.0.1:31080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:31080,http://127.0.0.1:31080}
      DB_NAME: ${MYSQL_DATABASE:-testhub}
      DB_USER: ${MYSQL_USER:-testhub}
      DB_PASSWORD: ${MYSQL_PASSWORD:-testhub123}
      DB_HOST: testhub-mysql
      DB_PORT: "3306"
      REDIS_URL: redis://:${REDIS_PASSWORD:-1234}@testhub-redis:6379/0
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@testhub.local}
      INIT_SEED_BUNDLE_DIR: /app/init-seed
      INIT_SEED_MARKER_FILE: /app/data/.init-seed-imported
      APP_INIT_MARKER_FILE: /app/data/.app-init-complete
      IMPORT_INIT_SEED: ${IMPORT_INIT_SEED:-1}
      FORCE_INIT_SEED: ${FORCE_INIT_SEED:-0}
      INIT_SEED_COPY_MEDIA: ${INIT_SEED_COPY_MEDIA:-1}
      COLLECTSTATIC_ON_INIT: ${COLLECTSTATIC_ON_INIT:-1}
      RUN_INIT_LOCATOR_STRATEGIES: ${RUN_INIT_LOCATOR_STRATEGIES:-1}
      CREATE_ADMIN_USER: ${CREATE_ADMIN_USER:-1}
      CODEX_RUNTIME_IMAGE: ${CODEX_RUNTIME_IMAGE:-local/testhub-platform-codex-runtime:latest}
      CLAUDE_RUNTIME_IMAGE: ${CLAUDE_RUNTIME_IMAGE:-local/testhub-platform-claude-runtime:latest}
    depends_on:
      testhub-mysql:
        condition: service_healthy
      testhub-redis:
        condition: service_healthy
    volumes:
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/appdata:/app/data:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/media:/app/media:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/static:/app/static:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/logs:/app/logs:z"
      - "${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:z"
      - ../init-seed:/app/init-seed:ro,z

  testhub-backend:
    image: local/testhub-platform-backend-bundle:${IMAGE_TAG:-20260424}
    container_name: ${CONTAINER_PREFIX:-testhub}-backend
    restart: unless-stopped
    init: true
    command: ["web"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-backend.settings_container}
      DEBUG: ${DEBUG:-False}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-0}
      APP_PORT: "8000"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-testhub-bundle}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testhub-frontend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:31080,http://127.0.0.1:31080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:31080,http://127.0.0.1:31080}
      DB_NAME: ${MYSQL_DATABASE:-testhub}
      DB_USER: ${MYSQL_USER:-testhub}
      DB_PASSWORD: ${MYSQL_PASSWORD:-testhub123}
      DB_HOST: testhub-mysql
      DB_PORT: "3306"
      REDIS_URL: redis://:${REDIS_PASSWORD:-1234}@testhub-redis:6379/0
      DOCKER_HOST: unix:///var/run/docker.sock
      PLAYWRIGHT_RECORDER_USE_XVFB: ${PLAYWRIGHT_RECORDER_USE_XVFB:-1}
      PLAYWRIGHT_RECORDER_XVFB_DISPLAY: ${PLAYWRIGHT_RECORDER_XVFB_DISPLAY:-:99}
      PLAYWRIGHT_RECORDER_XVFB_SCREEN: ${PLAYWRIGHT_RECORDER_XVFB_SCREEN:-1920x1080x24}
      PLAYWRIGHT_RECORDER_CDP_PORT: ${PLAYWRIGHT_RECORDER_CDP_PORT:-9222}
      PLAYWRIGHT_RECORDER_CDP_INTERNAL_PORT: ${PLAYWRIGHT_RECORDER_CDP_INTERNAL_PORT:-9333}
      PLAYWRIGHT_RECORDER_CDP_HOST_PORT: ${PLAYWRIGHT_RECORDER_CDP_HOST_PORT:-49222}
      PLAYWRIGHT_RECORDER_DEVTOOLS_EXTERNAL_ORIGIN: ${PLAYWRIGHT_RECORDER_DEVTOOLS_EXTERNAL_ORIGIN:-http://localhost:49222}
      PLAYWRIGHT_RECORDER_LOCALHOST_REWRITE_HOST: ${PLAYWRIGHT_RECORDER_LOCALHOST_REWRITE_HOST:-host.docker.internal}
      PLAYWRIGHT_RECORDER_NOVNC_ENABLED: ${PLAYWRIGHT_RECORDER_NOVNC_ENABLED:-1}
      PLAYWRIGHT_RECORDER_VNC_PORT: ${PLAYWRIGHT_RECORDER_VNC_PORT:-5900}
      PLAYWRIGHT_RECORDER_NOVNC_PORT: ${PLAYWRIGHT_RECORDER_NOVNC_PORT:-6080}
      PLAYWRIGHT_RECORDER_NOVNC_HOST_PORT: ${PLAYWRIGHT_RECORDER_NOVNC_HOST_PORT:-46080}
      PLAYWRIGHT_RECORDER_NOVNC_EXTERNAL_ORIGIN: ${PLAYWRIGHT_RECORDER_NOVNC_EXTERNAL_ORIGIN:-http://localhost:46080}
      PLAYWRIGHT_RECORDER_NOVNC_PATH: ${PLAYWRIGHT_RECORDER_NOVNC_PATH:-websockify}
      PLAYWRIGHT_RECORDER_NOVNC_RESIZE: ${PLAYWRIGHT_RECORDER_NOVNC_RESIZE:-scale}
      PLAYWRIGHT_RECORDER_FCITX_ENABLED: ${PLAYWRIGHT_RECORDER_FCITX_ENABLED:-1}
      PLAYWRIGHT_RECORDER_MAX_SESSIONS: ${PLAYWRIGHT_RECORDER_MAX_SESSIONS:-5}
      PLAYWRIGHT_RECORDER_READY_TIMEOUT: ${PLAYWRIGHT_RECORDER_READY_TIMEOUT:-45}
      PLAYWRIGHT_RECORDER_CHROMIUM_LAUNCH_TIMEOUT: ${PLAYWRIGHT_RECORDER_CHROMIUM_LAUNCH_TIMEOUT:-30000}
      PLAYWRIGHT_RECORDER_INITIAL_NAVIGATION_TIMEOUT: ${PLAYWRIGHT_RECORDER_INITIAL_NAVIGATION_TIMEOUT:-30000}
      PLAYWRIGHT_RECORDER_DESKTOP_READY_TIMEOUT: ${PLAYWRIGHT_RECORDER_DESKTOP_READY_TIMEOUT:-8}
      PLAYWRIGHT_RECORDER_IGNORE_HTTPS_ERRORS: ${PLAYWRIGHT_RECORDER_IGNORE_HTTPS_ERRORS:-1}
      INIT_SEED_MARKER_FILE: /app/data/.init-seed-imported
      APP_INIT_MARKER_FILE: /app/data/.app-init-complete
      WAIT_FOR_APP_INIT: ${WAIT_FOR_APP_INIT:-1}
      CODEX_RUNTIME_IMAGE: ${CODEX_RUNTIME_IMAGE:-local/testhub-platform-codex-runtime:latest}
      CLAUDE_RUNTIME_IMAGE: ${CLAUDE_RUNTIME_IMAGE:-local/testhub-platform-claude-runtime:latest}
      CODEX_RUNTIME_DATA_ROOT: ${CODEX_RUNTIME_DATA_ROOT:-}
      CODEX_RUNTIME_VOLUME_PREFIX: ${CODEX_RUNTIME_VOLUME_PREFIX:-testhub_codex}
      CODEX_RUNTIME_REMOVE_CONTAINER: ${CODEX_RUNTIME_REMOVE_CONTAINER:-1}
    depends_on:
      testhub-mysql:
        condition: service_healthy
      testhub-redis:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-38000}:8000"
      - "${PLAYWRIGHT_RECORDER_CDP_HOST_PORT:-49222}-${PLAYWRIGHT_RECORDER_CDP_HOST_PORT_END:-49262}:${PLAYWRIGHT_RECORDER_CDP_PORT:-9222}-${PLAYWRIGHT_RECORDER_CDP_PORT_END:-9262}"
      - "${PLAYWRIGHT_RECORDER_NOVNC_HOST_PORT:-46080}-${PLAYWRIGHT_RECORDER_NOVNC_HOST_PORT_END:-46120}:${PLAYWRIGHT_RECORDER_NOVNC_PORT:-6080}-${PLAYWRIGHT_RECORDER_NOVNC_PORT_END:-6120}"
    volumes:
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/appdata:/app/data:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/media:/app/media:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/static:/app/static:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/logs:/app/logs:z"
      - "${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:z"
      - "/var/run/docker.sock:/var/run/docker.sock"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  testhub-celery-worker:
    image: local/testhub-platform-backend-bundle:${IMAGE_TAG:-20260424}
    container_name: ${CONTAINER_PREFIX:-testhub}-celery-worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-backend.settings_container}
      DEBUG: ${DEBUG:-False}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-0}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-testhub-bundle}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testhub-frontend}
      DB_NAME: ${MYSQL_DATABASE:-testhub}
      DB_USER: ${MYSQL_USER:-testhub}
      DB_PASSWORD: ${MYSQL_PASSWORD:-testhub123}
      DB_HOST: testhub-mysql
      DB_PORT: "3306"
      REDIS_URL: redis://:${REDIS_PASSWORD:-1234}@testhub-redis:6379/0
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-info}
      CELERY_QUEUE: ${CELERY_QUEUE:-celery,deployments}
      DEPLOYMENT_CELERY_QUEUE: ${DEPLOYMENT_CELERY_QUEUE:-deployments}
      CELERY_POOL: ${CELERY_POOL:-}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-}
      APP_INIT_MARKER_FILE: /app/data/.app-init-complete
      WAIT_FOR_APP_INIT: ${WAIT_FOR_APP_INIT:-1}
      CODEX_RUNTIME_IMAGE: ${CODEX_RUNTIME_IMAGE:-local/testhub-platform-codex-runtime:latest}
      CLAUDE_RUNTIME_IMAGE: ${CLAUDE_RUNTIME_IMAGE:-local/testhub-platform-claude-runtime:latest}
      CODEX_RUNTIME_DATA_ROOT: ${CODEX_RUNTIME_DATA_ROOT:-}
      CODEX_RUNTIME_VOLUME_PREFIX: ${CODEX_RUNTIME_VOLUME_PREFIX:-testhub_codex}
      CODEX_RUNTIME_REMOVE_CONTAINER: ${CODEX_RUNTIME_REMOVE_CONTAINER:-1}
    depends_on:
      testhub-mysql:
        condition: service_healthy
      testhub-redis:
        condition: service_healthy
    volumes:
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/appdata:/app/data:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/media:/app/media:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/static:/app/static:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/logs:/app/logs:z"
      - "${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:z"
 
  testhub-ai-dev-worker:
    image: local/testhub-platform-backend-bundle:${IMAGE_TAG:-20260424}
    container_name: ${CONTAINER_PREFIX:-testhub}-ai-dev-worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-backend.settings_container}
      DEBUG: ${DEBUG:-False}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-0}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-testhub-bundle}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testhub-frontend}
      DB_NAME: ${MYSQL_DATABASE:-testhub}
      DB_USER: ${MYSQL_USER:-testhub}
      DB_PASSWORD: ${MYSQL_PASSWORD:-testhub123}
      DB_HOST: testhub-mysql
      DB_PORT: "3306"
      REDIS_URL: redis://:${REDIS_PASSWORD:-1234}@testhub-redis:6379/0
      DOCKER_HOST: unix:///var/run/docker.sock
      CELERY_LOG_LEVEL: ${AIDEV_CELERY_LOG_LEVEL:-info}
      CELERY_QUEUE: ${AIDEV_CELERY_QUEUE:-ai_coding}
      CELERY_POOL: ${AIDEV_CELERY_POOL:-}
      CELERY_CONCURRENCY: ${AIDEV_CELERY_CONCURRENCY:-1}
      APP_INIT_MARKER_FILE: /app/data/.app-init-complete
      WAIT_FOR_APP_INIT: ${WAIT_FOR_APP_INIT:-1}
      AIDEV_RUNTIME_IMAGE: ${AIDEV_RUNTIME_IMAGE:-testhub/ai-dev:latest}
      CODEX_RUNTIME_IMAGE: ${CODEX_RUNTIME_IMAGE:-local/testhub-platform-codex-runtime:latest}
      CLAUDE_RUNTIME_IMAGE: ${CLAUDE_RUNTIME_IMAGE:-local/testhub-platform-claude-runtime:latest}
      CODEX_RUNTIME_DATA_ROOT: ${CODEX_RUNTIME_DATA_ROOT:-}
      CODEX_RUNTIME_VOLUME_PREFIX: ${CODEX_RUNTIME_VOLUME_PREFIX:-testhub_codex}
      CODEX_RUNTIME_REMOVE_CONTAINER: ${CODEX_RUNTIME_REMOVE_CONTAINER:-1}
    depends_on:
      testhub-mysql:
        condition: service_healthy
      testhub-redis:
        condition: service_healthy
    volumes:
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/appdata:/app/data:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/media:/app/media:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/static:/app/static:z"
      - "${DATA_ROOT:-/AIOps/data/testhub-platform}/logs:/app/logs:z"
      - "${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:z"
      - "/var/run/docker.sock:/var/run/docker.sock"

  testhub-frontend:
    image: local/testhub-platform-frontend-bundle:${IMAGE_TAG:-20260424}
    container_name: ${CONTAINER_PREFIX:-testhub}-frontend
    restart: unless-stopped
    depends_on:
      - testhub-backend
    ports:
      - "${FRONTEND_HOST_PORT:-31080}:80"

  testhub-codex-runtime:
    image: ${CODEX_RUNTIME_IMAGE:-local/testhub-platform-codex-runtime:latest}
    container_name: ${CONTAINER_PREFIX:-testhub}-codex-runtime
    restart: "no"
    command: ["codex", "--version"]

  testhub-claude-runtime:
    image: ${CLAUDE_RUNTIME_IMAGE:-local/testhub-platform-claude-runtime:latest}
    container_name: ${CONTAINER_PREFIX:-testhub}-claude-runtime
    restart: "no"
    command: ["claude", "--version"]
