server {
    listen 80;
    server_name _;
    charset utf-8;
    charset_types
        text/html
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript;

    client_max_body_size 200m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/testcases/playwright-recordings/[^/]+/allure-report/ {
        set $report_upstream http://testhub-report-service:8000;
        proxy_pass $report_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/testcases/(local-agent/|playwright-|visual-flow) {
        set $automation_upstream http://testhub-automation-service:8000;
        proxy_pass $automation_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /api/ui-automation/ {
