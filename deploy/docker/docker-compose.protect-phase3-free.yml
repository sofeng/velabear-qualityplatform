version: "2.4"

x-app-environment: &app-environment
  TZ: ${TZ:-Asia/Shanghai}
  DJANGO_SETTINGS_MODULE: backend.settings_container
  DEBUG: "False"
  ENABLE_API_DOCS: "0"
  APP_PORT: "8000"
  SECRET_KEY: ${SECRET_KEY:-django-insecure-testhub-bundle}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,172.31.119.49,host.docker.internal,testhub-backend,testhub-automation-service,testhub-document-service,testhub-asset-service,testhub-integration-service,testhub-report-service,testhub-deployment-service,testhub-frontend}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://172.31.119.49:42380,http://localhost:42380,http://127.0.0.1:42380}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://172.31.119.49:42380,http://localhost:42380,http://127.0.0.1:42380}
  DB_NAME: ${MYSQL_DATABASE:-testhub}
  DB_USER: ${MYSQL_USER:-testhub}
  DB_PASSWORD: ${MYSQL_PASSWORD:-testhub123}
  DB_HOST: testhub-mysql
  DB_PORT: "3306"
  REDIS_URL: redis://:${REDIS_PASSWORD:-1234}@testhub-redis:6379/0
  INIT_SEED_MARKER_FILE: /app/data/.init-seed-imported
  APP_INIT_MARKER_FILE: /app/data/.app-init-complete
  WAIT_FOR_APP_INIT: "1"

x-runtime-depends: &runtime-depends
  testhub-mysql:
    condition: service_healthy
  testhub-redis:
    condition: service_healthy

x-runtime-healthcheck: &runtime-healthcheck
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/runtime-health/', timeout=5)"
  interval: 15s
  timeout: 8s
  retries: 20
  start_period: 30s

services:
  testhub-mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: testhub-protect-p3free-20260612-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testhub}
      MYSQL_USER: ${MYSQL_USER:-testhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testhub123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "33606:3306"
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/mysql:/var/lib/mysql:z
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  testhub-redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: testhub-protect-p3free-20260612-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-1234}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "36679:6379"
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/redis:/data:z
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  testhub-backend-init:
    image: ${BACKEND_IMAGE:-local/testhub-platform-backend-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-backend-init
    restart: "no"
    command: ["init"]
    environment:
      <<: *app-environment
      TESTHUB_RUNTIME_ROLE: core
      DJANGO_ROOT_URLCONF: backend.urls_core
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@testhub.local}
      INIT_SEED_BUNDLE_DIR: /app/init-seed
      IMPORT_INIT_SEED: ${IMPORT_INIT_SEED:-1}
      FORCE_INIT_SEED: ${FORCE_INIT_SEED:-0}
      INIT_SEED_COPY_MEDIA: ${INIT_SEED_COPY_MEDIA:-1}
      COLLECTSTATIC_ON_INIT: ${COLLECTSTATIC_ON_INIT:-1}
      RUN_INIT_LOCATOR_STRATEGIES: ${RUN_INIT_LOCATOR_STRATEGIES:-1}
      CREATE_ADMIN_USER: ${CREATE_ADMIN_USER:-1}
    depends_on: *runtime-depends
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/media:/app/media:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/static:/app/static:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/logs:/app/logs:z
      - ../init-seed:/app/init-seed:ro,z

  testhub-backend:
    image: ${BACKEND_IMAGE:-local/testhub-platform-backend-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-backend
    restart: unless-stopped
    init: true
    command: ["web"]
    environment:
      <<: *app-environment
      TESTHUB_RUNTIME_ROLE: core
      DJANGO_ROOT_URLCONF: backend.urls_core
    depends_on: *runtime-depends
    ports:
      - "58300:8000"
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/media:/app/media:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/static:/app/static:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/logs:/app/logs:z
    healthcheck: *runtime-healthcheck

  testhub-automation-service:
    image: ${AUTOMATION_IMAGE:-local/testhub-platform-backend-automation-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-automation-service
    restart: unless-stopped
    init: true
    command: ["web"]
    environment:
      <<: *app-environment
      TESTHUB_RUNTIME_ROLE: automation
      DJANGO_ROOT_URLCONF: backend.urls_automation
      PLAYWRIGHT_RECORDER_USE_XVFB: "1"
      PLAYWRIGHT_RECORDER_XVFB_DISPLAY: ":99"
      PLAYWRIGHT_RECORDER_XVFB_SCREEN: 1920x1080x24
      PLAYWRIGHT_RECORDER_CDP_PORT: "9222"
      PLAYWRIGHT_RECORDER_CDP_PORT_END: "9262"
      PLAYWRIGHT_RECORDER_CDP_INTERNAL_PORT: "9333"
      PLAYWRIGHT_RECORDER_CDP_HOST_PORT: "59522"
      PLAYWRIGHT_RECORDER_CDP_HOST_PORT_END: "59562"
      PLAYWRIGHT_RECORDER_DEVTOOLS_EXTERNAL_ORIGIN: ${PLAYWRIGHT_RECORDER_DEVTOOLS_EXTERNAL_ORIGIN:-http://172.31.119.49:59522}
      PLAYWRIGHT_RECORDER_LOCALHOST_REWRITE_HOST: host.docker.internal
      PLAYWRIGHT_RECORDER_NOVNC_ENABLED: "1"
      PLAYWRIGHT_RECORDER_VNC_PORT: "5900"
      PLAYWRIGHT_RECORDER_NOVNC_PORT: "6080"
      PLAYWRIGHT_RECORDER_NOVNC_PORT_END: "6120"
      PLAYWRIGHT_RECORDER_NOVNC_HOST_PORT: "56680"
      PLAYWRIGHT_RECORDER_NOVNC_HOST_PORT_END: "56720"
      PLAYWRIGHT_RECORDER_NOVNC_EXTERNAL_ORIGIN: ${PLAYWRIGHT_RECORDER_NOVNC_EXTERNAL_ORIGIN:-http://172.31.119.49:56680}
      PLAYWRIGHT_RECORDER_NOVNC_PATH: websockify
      PLAYWRIGHT_RECORDER_NOVNC_RESIZE: scale
      PLAYWRIGHT_RECORDER_FCITX_ENABLED: "1"
      PLAYWRIGHT_RECORDER_MAX_SESSIONS: "5"
      PLAYWRIGHT_RECORDER_READY_TIMEOUT: "45"
      PLAYWRIGHT_RECORDER_CHROMIUM_LAUNCH_TIMEOUT: "30000"
      PLAYWRIGHT_RECORDER_INITIAL_NAVIGATION_TIMEOUT: "30000"
      PLAYWRIGHT_RECORDER_DESKTOP_READY_TIMEOUT: "8"
      PLAYWRIGHT_RECORDER_IGNORE_HTTPS_ERRORS: "1"
    depends_on: *runtime-depends
    ports:
      - "59522-59562:9222-9262"
      - "127.0.0.1:56680-56720:6080-6120"
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/media:/app/media:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/static:/app/static:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/logs:/app/logs:z
      - ../../playwright_snapshot:/app/playwright_snapshot:z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: *runtime-healthcheck

  testhub-document-service:
    image: ${DOCUMENT_IMAGE:-local/testhub-platform-backend-document-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-document-service
    restart: unless-stopped
    command: ["web"]
    environment:
      <<: *app-environment
      TESTHUB_RUNTIME_ROLE: document
      DJANGO_ROOT_URLCONF: backend.urls_document
    depends_on: *runtime-depends
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/media:/app/media:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/static:/app/static:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/logs:/app/logs:z
    healthcheck: *runtime-healthcheck

  testhub-asset-service:
    image: ${ASSET_IMAGE:-local/testhub-platform-backend-asset-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-asset-service
    restart: unless-stopped
    command: ["web"]
    environment:
      <<: *app-environment
      TESTHUB_RUNTIME_ROLE: asset
      DJANGO_ROOT_URLCONF: backend.urls_asset
      ASSET_CELERY_QUEUE: asset_insight
    depends_on: *runtime-depends
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/media:/app/media:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/static:/app/static:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/logs:/app/logs:z
    healthcheck: *runtime-healthcheck

  testhub-integration-service:
    image: ${INTEGRATION_IMAGE:-local/testhub-platform-backend-integration-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-integration-service
    restart: unless-stopped
    init: true
    command: ["web"]
    environment:
      <<: *app-environment
      TESTHUB_RUNTIME_ROLE: integration
      DJANGO_ROOT_URLCONF: backend.urls_integration
      TESTHUB_DOCUMENT_SERVICE_URL: http://testhub-document-service:8000
      DOCKER_HOST: unix:///var/run/docker.sock
      CODEX_RUNTIME_IMAGE: ${CODEX_RUNTIME_IMAGE:-local/testhub-platform-codex-runtime-protect-remote-p3free:latest}
      CLAUDE_RUNTIME_IMAGE: ${CLAUDE_RUNTIME_IMAGE:-local/testhub-platform-claude-runtime-protect-remote-p3free:latest}
      CODEX_RUNTIME_DATA_ROOT: ${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}
      CODEX_RUNTIME_VOLUME_PREFIX: ${CODEX_RUNTIME_VOLUME_PREFIX:-testhub_codex}
      CODEX_RUNTIME_REMOVE_CONTAINER: ${CODEX_RUNTIME_REMOVE_CONTAINER:-1}
      AI_SESSION_WORKSPACE_CODEX_ENABLED: "1"
    depends_on: *runtime-depends
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/media:/app/media:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/static:/app/static:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/logs:/app/logs:z
      - ${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:z
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: *runtime-healthcheck

  testhub-report-service:
    image: ${REPORT_IMAGE:-local/testhub-platform-backend-report-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-report-service
    restart: unless-stopped
    command: ["web"]
    environment:
      <<: *app-environment
      TESTHUB_RUNTIME_ROLE: report
      DJANGO_ROOT_URLCONF: backend.urls_report
    depends_on: *runtime-depends
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/media:/app/media:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/static:/app/static:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/logs:/app/logs:z
    healthcheck: *runtime-healthcheck

  testhub-deployment-service:
    image: ${DEPLOYMENT_IMAGE:-local/testhub-platform-backend-deployment-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-deployment-service
    restart: unless-stopped
    command: ["web"]
    environment:
      <<: *app-environment
      TESTHUB_RUNTIME_ROLE: deployment
      DJANGO_ROOT_URLCONF: backend.urls_deployment
    depends_on: *runtime-depends
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/media:/app/media:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/static:/app/static:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/logs:/app/logs:z
      - ../../.release_out:/workspace-release:ro,z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: *runtime-healthcheck

  testhub-asset-worker:
    image: ${ASSET_IMAGE:-local/testhub-platform-backend-asset-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-asset-worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *app-environment
      TESTHUB_RUNTIME_ROLE: asset-worker
      DJANGO_ROOT_URLCONF: backend.urls_asset
      CELERY_QUEUE: asset_insight
      CELERY_CONCURRENCY: ${ASSET_CELERY_CONCURRENCY:-2}
      TESTHUB_CELERY_TASK_MODULES: apps.knowledge.tasks
    depends_on: *runtime-depends
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/media:/app/media:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/static:/app/static:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/logs:/app/logs:z

  testhub-deployment-worker:
    image: ${DEPLOYMENT_IMAGE:-local/testhub-platform-backend-deployment-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-deployment-worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *app-environment
      TESTHUB_RUNTIME_ROLE: deployment-worker
      DJANGO_ROOT_URLCONF: backend.urls_deployment
      CELERY_QUEUE: deployments
      CELERY_CONCURRENCY: ${DEPLOYMENT_CELERY_CONCURRENCY:-2}
      TESTHUB_CELERY_TASK_MODULES: apps.deployments.tasks
    depends_on: *runtime-depends
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/media:/app/media:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/static:/app/static:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/logs:/app/logs:z
      - ../../.release_out:/workspace-release:ro,z
      - /var/run/docker.sock:/var/run/docker.sock

  testhub-ai-dev-worker:
    image: ${INTEGRATION_IMAGE:-local/testhub-platform-backend-integration-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-ai-dev-worker
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *app-environment
      TESTHUB_RUNTIME_ROLE: ai-dev-worker
      DJANGO_ROOT_URLCONF: backend.urls_integration
      TESTHUB_DOCUMENT_SERVICE_URL: http://testhub-document-service:8000
      DOCKER_HOST: unix:///var/run/docker.sock
      CELERY_QUEUE: ai_coding
      CELERY_CONCURRENCY: ${AIDEV_CELERY_CONCURRENCY:-1}
      TESTHUB_CELERY_TASK_MODULES: apps.ai_development.tasks
      AIDEV_RUNTIME_IMAGE: ${AIDEV_RUNTIME_IMAGE:-testhub/ai-dev:latest}
      CODEX_RUNTIME_IMAGE: ${CODEX_RUNTIME_IMAGE:-local/testhub-platform-codex-runtime-protect-remote-p3free:latest}
      CLAUDE_RUNTIME_IMAGE: ${CLAUDE_RUNTIME_IMAGE:-local/testhub-platform-claude-runtime-protect-remote-p3free:latest}
      CODEX_RUNTIME_DATA_ROOT: ${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}
      CODEX_RUNTIME_VOLUME_PREFIX: ${CODEX_RUNTIME_VOLUME_PREFIX:-testhub_codex}
      CODEX_RUNTIME_REMOVE_CONTAINER: ${CODEX_RUNTIME_REMOVE_CONTAINER:-1}
      AI_SESSION_WORKSPACE_CODEX_ENABLED: "1"
    depends_on: *runtime-depends
    volumes:
      - ../../.docker-data/testhub-platform-protect-phase3-free/appdata:/app/data:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/media:/app/media:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/static:/app/static:z
      - ../../.docker-data/testhub-platform-protect-phase3-free/logs:/app/logs:z
      - ${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:${CODEX_RUNTIME_DATA_ROOT:-/AIOps/data/testhub-platform/codex}:z
      - /var/run/docker.sock:/var/run/docker.sock

  testhub-frontend:
    image: ${FRONTEND_IMAGE:-local/testhub-platform-frontend-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-frontend
    restart: unless-stopped
    depends_on:
      - testhub-backend
      - testhub-automation-service
      - testhub-document-service
      - testhub-asset-service
      - testhub-integration-service
      - testhub-report-service
      - testhub-deployment-service
    ports:
      - "42380:80"

  testhub-codex-runtime:
    image: ${CODEX_RUNTIME_IMAGE:-local/testhub-platform-codex-runtime-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-codex-runtime
    restart: "no"
    command: ["codex", "--version"]

  testhub-claude-runtime:
    image: ${CLAUDE_RUNTIME_IMAGE:-local/testhub-platform-claude-runtime-protect-remote-p3free:latest}
    container_name: testhub-protect-p3free-20260612-claude-runtime
    restart: "no"
    command: ["claude", "--version"]
